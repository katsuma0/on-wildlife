<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>on-wildlife</title>

  <!-- Fit the phone screen edge-to-edge with safe-area insets; allow pinch-zoom & OS text scaling (WCAG 1.4.4 / AODA) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- iOS: run fullscreen when added to the Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wildlife Log" />
  <meta name="format-detection" content="telephone=no" />

  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="A simple, iOS-style field journal for logging Ontario's wildlife, fish, plants, trees, insects and fungi." />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/ios.css" />
  <script>
    /* Two tiny synchronous jobs before first paint:
       1. Hide the static first-run privacy sheet for anyone who already accepted.
       2. Read the shared 'outdoors-appearance' key (one JSON key for every site
          on this origin) and stamp its data attributes on <html> so theme,
          palette, face, text size and glass are right with no flash. An old
          per-app theme in owl-settings migrates into the key once, and so does
          one round of renames: a saved face "system" without the v2 marker
          moves to the new Parks default, and palette "shore" becomes "parks".
          Parks is the default for palette and face, so neither stamps. */
    (function () {
      var d = document.documentElement, st = {};
      try { st = JSON.parse(localStorage.getItem('owl-settings') || '{}') || {}; } catch (e) {}
      if (st.seenPrivacy) d.className += ' privacy-ok';
      var a = null, save = false;
      try { a = JSON.parse(localStorage.getItem('outdoors-appearance') || 'null'); } catch (e) {}
      if (!a || typeof a !== 'object') {
        a = {};
        if (st.theme === 'light' || st.theme === 'dark') a.theme = st.theme;
        save = true;
      }
      if (a.face === 'system' && !a.v2) { delete a.face; a.v2 = 1; save = true; }
      if (a.palette === 'shore') { a.palette = 'parks'; save = true; }
      if (save) { try { localStorage.setItem('outdoors-appearance', JSON.stringify(a)); } catch (e) {} }
      if (a.theme === 'light' || a.theme === 'dark') d.setAttribute('data-theme', a.theme);
      if (a.glass === 'off') d.setAttribute('data-glass', 'off');
      if (a.palette === 'field' || a.palette === 'granite') d.setAttribute('data-palette', a.palette);
      if (a.face === 'system' || a.face === 'rounded' || a.face === 'serif' || a.face === 'avenir' || a.face === 'mono') d.setAttribute('data-face', a.face);
      if (a.size === 's' || a.size === 'l' || a.size === 'xl') d.setAttribute('data-textsize', a.size);
    })();
  </script>
</head>
<body>
  <!-- A real first paint before any script arrives: the same chrome and large
       title the Guide renders, so the page is visible while the data loads.
       boot() replaces all of this with the routed screen. -->
  <div id="app">
    <div class="screen">
      <header class="ios-header"><div class="ios-header-row">
        <a class="ios-avatar" href="#/account" aria-label="Account"><svg aria-hidden="true"><use href="assets/icons.svg#user"/></svg></a>
        <div class="ios-header-actions">
          <span class="ios-glass-btn" aria-hidden="true"><svg><use href="assets/icons.svg#plus"/></svg></span>
          <a class="ios-glass-btn" href="#/search" aria-label="Search"><svg aria-hidden="true"><use href="assets/icons.svg#search"/></svg></a>
        </div>
      </div></header>
      <div class="large-title"><div class="large-head"><h1>on-wildlife</h1></div>
        <div class="subtitle">Ontario&rsquo;s wildlife, and your journal of it.</div>
      </div>
    </div>
  </div>

  <nav class="ios-tabbar" id="tabbar" aria-label="Primary"><!-- tab bar renders here --></nav>

  <div id="sheet-root">
    <!-- The first-run privacy notice ships in the HTML so it is readable at
         first paint, before any script arrives. The head script hides it for
         anyone who already accepted; the app wires the buttons and owns it
         from boot onward. Markup mirrors maybePrivacyBanner() exactly. -->
    <div class="privacy-static">
      <div class="scrim show" data-action="accept-privacy"></div>
      <div class="sheet show" id="sheet" style="max-height:none">
        <div class="sheet-grabber"></div>
        <div class="sheet-body" style="padding:8px 20px calc(24px + var(--sa-bottom))">
          <div style="text-align:center;font-size:44px;margin:8px 0">&#x1F43E;</div>
          <h2 style="text-align:center;margin:0 0 6px;font-size:22px">Welcome to Wildlife Log</h2>
          <p style="text-align:center;color:var(--label-2);font-size:15px;line-height:1.45;margin:0 0 16px">Log the wildlife, fish and plants you find across Ontario. <b>Your sightings stay private on your device.</b> Nothing you log is uploaded unless you choose to turn on sharing.</p>
          <button class="btn btn-primary btn-block" data-action="accept-privacy">Get started</button>
          <div class="spacer"></div>
          <button class="btn btn-plain btn-block" data-action="open-privacy-first" style="height:40px">Read our privacy note</button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-root" role="status" aria-live="polite" aria-atomic="true"><!-- toasts mount here --></div>

  <!-- The mapping library (vendor/leaflet/leaflet.js) loads on demand from
       the Map tab; it has no business in the boot chain -->

  <!-- Data (plain globals, no build step needed) -->
  <script defer src="data/categories.js"></script>
  <script defer src="data/species.js"></script>
  <!-- data/notes.js (the long "In depth" accounts, 650KB) loads lazily from
       boot() so it never sits between the reader and first paint -->
  <script defer src="data/regulations.js"></script>
  <script defer src="data/learn.js"></script>
  <script defer src="data/trust.js"></script>
  <script defer src="data/badges.js"></script>
  <script defer src="data/ecosystem.js"></script>

  <!-- App -->
  <script defer src="share.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
