<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>on-wildlife</title>

  <!-- Fit the phone screen edge-to-edge with safe-area insets; allow pinch-zoom & OS text scaling (WCAG 1.4.4 / AODA) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- iOS: run fullscreen when added to the Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wildlife Log" />
  <meta name="format-detection" content="telephone=no" />

  <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="A simple, iOS-style field journal for logging Ontario's wildlife, fish, plants, trees, insects and fungi." />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"><!-- screens render here --></div>

  <nav class="tabbar" id="tabbar"><!-- tab bar renders here --></nav>

  <div id="sheet-root"><!-- modal sheets mount here --></div>
  <div id="toast-root" role="status" aria-live="polite" aria-atomic="true"><!-- toasts mount here --></div>

  <!-- Mapping library (vendored, offline-capable; tiles need a connection) -->
  <script src="vendor/leaflet/leaflet.js"></script>

  <!-- Data (plain globals, no build step needed) -->
  <script src="data/categories.js"></script>
  <script src="data/species.js"></script>
  <script src="data/notes.js"></script>
  <script src="data/learn.js"></script>
  <script src="data/trust.js"></script>
  <script src="data/badges.js"></script>
  <script src="data/ecosystem.js"></script>

  <!-- App -->
  <script src="share.js"></script>
  <script src="app.js"></script>
</body>
</html>
