<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ontario Wildlife Log</title>

  <!-- Fit the phone screen edge-to-edge, allow safe-area insets, block zoom for an app feel -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

  <!-- iOS: run fullscreen when added to the Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wildlife Log" />
  <meta name="format-detection" content="telephone=no" />

  <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="A simple, iOS-style field journal for logging Ontario wildlife, fish and bird sightings." />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"><!-- screens render here --></div>

  <nav class="tabbar" id="tabbar"><!-- tab bar renders here --></nav>

  <div id="sheet-root"><!-- modal sheets mount here --></div>
  <div id="toast-root"><!-- toasts mount here --></div>

  <!-- Data (plain globals — no build step needed) -->
  <script src="data/categories.js"></script>
  <script src="data/species.js"></script>

  <!-- App -->
  <script src="app.js"></script>
</body>
</html>
